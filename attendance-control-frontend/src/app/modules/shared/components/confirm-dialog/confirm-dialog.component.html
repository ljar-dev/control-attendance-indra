<div class="dialog-overlay" [class.show]="visible" (click)="onOverlayClick($event)">
  <div class="dialog-container" [class.show]="visible">
    <div class="dialog-header">
      <h3>{{ header }}</h3>
      <button class="dialog-close" (click)="reject()">×</button>
    </div>
    
    <div class="dialog-body">
      <p>{{ message }}</p>
    </div>
    
    <div class="dialog-footer">
      <button class="btn btn-cancel" (click)="reject()">
        {{ rejectLabel }}
      </button>
      <button class="btn btn-confirm" (click)="accept()">
        {{ acceptLabel }}
      </button>
    </div>
  </div>
</div>
